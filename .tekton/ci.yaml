# Check "tekton-xlab / sdk-test-": regenerate, test and pack both SDKs on
# pull requests to main and on main itself. Sandboxed Nix, no credentials.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: sdk-test-
  annotations:
    pipelinesascode.tekton.dev/on-event: '[pull_request, push]'
    pipelinesascode.tekton.dev/on-target-branch: '[main]'
    pipelinesascode.tekton.dev/target-namespace: tekton-buildkit
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '5'
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: ohip-sdk-ci
spec:
  params:
    - name: revision
      value: '{{ revision }}'
  taskRunTemplate:
    serviceAccountName: default
    podTemplate:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        storage.xlab.now/fast-local: 'true'
  taskRunSpecs:
    - pipelineTaskName: validate
      podTemplate:
        hostUsers: false
      # Peak 14 days to 22 Nov 2026: RSS 3.8 GiB, working set 4.0 GiB.
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: '1'
              memory: 5Gi
            limits:
              memory: 24Gi
    - pipelineTaskName: publish-cache
      serviceAccountName: nix-cache-publisher
  timeouts:
    pipeline: 60m
  pipelineSpec:
    params:
      - name: revision
        type: string
    workspaces:
      - name: git-auth
      - name: nix-cache-export
    tasks:
      - name: validate
        timeout: 45m
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: nix-v1}
            - {name: namespace, value: tekton-buildkit}
        params:
          - {name: URL, value: 'https://github.com/applyinnovations/ohip-sdk.git'}
          - {name: REVISION, value: '$(params.revision)'}
          - name: SCRIPT
            value: |
              git config --global --add safe.directory '*'
              nix develop --command scripts/ci/validate.sh
        workspaces:
          - {name: basic-auth, workspace: git-auth}
          - {name: nix-cache-export, workspace: nix-cache-export}
    # Push runs publish the Nix task's cache export to the shared Nix cache.
    finally:
      - name: publish-cache
        # Only push and nightly (incoming) runs publish: a pull request or
        # comment run builds unmerged code, so it must not write the shared
        # cache (xlab-deployments policy tekton-nix-cache-publish-trusted-events).
        when:
          - input: "{{ event_type }}"
            operator: in
            values:
              - push
              - incoming
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: nix-cache-publish-v1}
            - {name: namespace, value: tekton-pipelines}
        workspaces:
          - {name: nix-cache-export, workspace: nix-cache-export}
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
    # The Nix task's cache export (store paths the Nix cache lacks, written
    # only on push and scheduled runs) for publish-cache. Each Nix task keeps
    # its own store.
    - name: nix-cache-export
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: scratch-local
          resources:
            requests:
              storage: 10Gi
