# Publishes the npm package with npm trusted publishing (OIDC, no token), the
# one exception to this repository's Tekton-only CI: npm trusted publishing only
# supports GitHub-hosted runners. Everything else in a release (Go modules,
# GitHub release asset) is .tekton/release.yaml. See docs/releasing.md.
# The build job runs the tag's own release build with no credentials; the
# publish job never runs the tag's code, waits for approval in the `release`
# environment and publishes the build's tarball with provenance. Run it by
# hand with a tag input for a tag pushed before this workflow existed.
name: npm-publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: scripts/ci
          persist-credentials: false
      # Full history and main, so check-release-tag.sh can prove the tag is on main.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag
        working-directory: source
        run: ../ci/scripts/ci/check-release-tag.sh "$TAG" "$(git rev-parse HEAD)"
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: Build
        working-directory: source
        run: nix develop --command scripts/ci/release-build.sh "$TAG" "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: scripts/ci
          persist-credentials: false
      # npm 11.19.1 (trusted publishing needs npm >= 11.5.1). No registry-url:
      # that writes an .npmrc expecting a token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts
      - name: Publish
        run: node ci/scripts/ci/publish-npm.mjs "$TAG" artifacts
